# Henter fakturaer fra bilagsmottaket i Tripletex og omsetning fra Planday for alle kunder, to ganger om dagen.
# Krever hemmeligheten CRON_SECRET både her (Settings → Secrets and variables → Actions) og i Render (Environment).
name: Henting fra Planday og Tripletex
on:
  schedule:
    # 05:00 og 13:00 UTC = kl. 06 og 14 norsk vintertid (07 og 15 sommertid)
    - cron: "0 5,13 * * *"
  workflow_dispatch: {}
jobs:
  hent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kall Restoq /api/cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET er ikke satt – hopper over."; exit 0; fi
          # Render kan bruke litt tid på å våkne; prøv på nytt ved feil
          for i in 1 2 3; do
            if curl -fsS -m 600 -H "Authorization: Bearer $CRON_SECRET" https://restoq.no/api/cron; then echo; exit 0; fi
            echo "Forsøk $i feilet, prøver igjen om 60 sek."; sleep 60
          done
          exit 1
